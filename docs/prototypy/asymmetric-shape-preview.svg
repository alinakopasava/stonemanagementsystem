<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 250" width="330" height="750">
  <rect width="100%" height="100%" fill="#f4f1ea"/>

  <!-- Reference grid (10% of width / height) -->
  <g stroke="#d8d2c3" stroke-width="0.2">
    <line x1="5" y1="0"   x2="5" y2="250"/>
    <line x1="15" y1="0"  x2="15" y2="250"/>
    <line x1="25" y1="0"  x2="25" y2="250"/>
    <line x1="35" y1="0"  x2="35" y2="250"/>
    <line x1="45" y1="0"  x2="45" y2="250"/>
    <line x1="55" y1="0"  x2="55" y2="250"/>
    <line x1="65" y1="0"  x2="65" y2="250"/>
    <line x1="75" y1="0"  x2="75" y2="250"/>
    <line x1="85" y1="0"  x2="85" y2="250"/>
    <line x1="95" y1="0"  x2="95" y2="250"/>
    <line x1="105" y1="0" x2="105" y2="250"/>

    <line x1="5"   y1="5"   x2="105" y2="5"/>
    <line x1="5"   y1="55"  x2="105" y2="55"/>
    <line x1="5"   y1="105" x2="105" y2="105"/>
    <line x1="5"   y1="155" x2="105" y2="155"/>
    <line x1="5"   y1="205" x2="105" y2="205"/>
    <line x1="5"   y1="245" x2="105" y2="245"/>
  </g>

  <!-- Headstone silhouette: width = 100 (x: 5..105), height = 240 (y: 5..245), bottom at y=245 -->
  <!--
    Left  edge top:  (5,   12)   = 97% wysoko[ci
    Right edge top:  (105, 55)   = 79% wysoko[ci
    Top wave: jedna kubiczna krzywa Beziera z punktami kontrolnymi tworzcymi
    asymetryczn fal (maBy garbik przy prawej, dBugi spadek, szczyt blisko lewej).
  -->
  <path
    d="M 5 245
       L 105 245
       L 105 55
       C 85 25,
         -5 -10,
         5 12
       L 5 245 Z"
    fill="#1b1b1b"
    stroke="#444"
    stroke-width="0.5"/>

  <!-- Punkty kontrolne pokazane jako kropki dla czytelno[ci -->
  <g fill="#d23">
    <circle cx="85" cy="25"  r="1.3"/>
    <circle cx="-5" cy="-10" r="1.3"/>
  </g>
  <g fill="#28a">
    <circle cx="105" cy="55" r="1.6"/>
    <circle cx="5"   cy="12" r="1.6"/>
  </g>

  <!-- Etykiety -->
  <g font-family="Arial, sans-serif" font-size="3" fill="#555">
    <text x="6"   y="11">L:97%</text>
    <text x="92"  y="60">R:79%</text>
  </g>
</svg>
