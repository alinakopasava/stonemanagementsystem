<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The ground is painted before React boots so the first frame is not a
         white flash on a dark-mode device. Values track --canvas in
         src/presentation/design/tokens.css. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101413" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Design a monument online: choose the shape, stone, size and finish, and see the result in 3D before it is made."
    />
    <!-- Without these the browser asks for /favicon.ico on every load and takes
         a 404 for it. The SVG is what modern browsers use; the .ico covers the
         older ones and Windows shortcuts. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The display face is used above the fold, so it is fetched alongside
         the document rather than after the stylesheet parses. -->
    <link
      rel="preload"
      href="/fonts/pt-serif-700.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <style>
      html {
        background: #f0f1ee;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #101413;
        }
      }
    </style>
    <title>Signature Stone | Monument Catalog &amp; Orders</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
